appId: com.eduardoschork.refinedredmine
productName: Refined Redmine
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  # Ad-hoc signature ("-"): without it macOS drops notifications. To distribute without the
  # Gatekeeper warning, switch to a Developer ID certificate + notarization (Apple Developer account).
  identity: '-'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDir: true
  shortcutName: Refined Redmine
